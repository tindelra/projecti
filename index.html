<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Invitation | Solusi Undangan Digital Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --maroon-deep: #4A0404;
            --maroon-bright: #8B0000;
            --gold: #D4AF37;
            --gold-light: #F1D592;
            --cream-bg: #F5F2E4;
            --text-dark: #2D0202;
            --text-light: #FFF5F5;
            --glass: rgba(74, 4, 4, 0.95);
            --glass-border: rgba(74, 4, 4, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--cream-bg);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Background Ornaments */
        .bg-ornament {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            background: url('C:/Users/pc/.gemini/antigravity/brain/cf9e6890-ae50-4775-8612-5a44019d0f14/landing_page_bg_ornament_1773219409048.png') no-repeat center center;
            background-size: contain;
            opacity: 0.08;
            /* Lower opacity for subtle look on light bg */
            z-index: -1;
            animation: slowRotate 100s linear infinite;
        }

        @keyframes slowRotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
            z-index: 10;
            padding: 40px 20px;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            color: var(--gold);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-weight: 600;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 50px;
            color: var(--maroon-bright);
            opacity: 0.9;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .invitation-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .invitation-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .invitation-card:hover {
            transform: translateY(-10px);
            border-color: var(--gold);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .invitation-card:hover::before {
            opacity: 1;
        }

        .invitation-card .title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--gold-light);
        }

        .invitation-card .desc {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .invitation-card:hover .btn {
            background: var(--gold);
            color: var(--maroon-deep);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 80px;
            }

            footer {
                position: static;
                margin-top: 50px;
                padding-bottom: 30px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-ornament"></div>

    <div class="container">
        <h1>Go Invitation</h1>
        <p class="subtitle">Digital Wedding Excellence</p>

        <div class="card-grid">
            <!-- Ardella & Krisna -->
            <a href="/ardella-krisna/" class="invitation-card">
                <div class="title">Ardella & Krisna</div>
                <p class="desc">Akad & Resepsi
                </p>
                <div class="btn">Buka Undangan</div>
            </a>

            <!-- Krisna & Ardella (Alternative/Test) -->
            <a href="/krisna-ardella/" class="invitation-card">
                <div class="title">Krisna & Ardella</div>
                <p class="desc">Ngunduh Mantu
                </p>
                <div class="btn">Buka Undangan</div>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Go Invitation. Digital Memories.
    </footer>
</body>

</html>
